<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Flowbit 알림 서비스</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f7f9fb;">
<div style="max-width: 480px; margin: 0 auto; padding: 20px; background-color: #f7f9fb; box-sizing: border-box; width: 100%;">
    <div style="max-width: 480px; margin: 0 auto; padding: 20px; box-sizing: border-box; width: 100%;">
        <img src="https://likelionvideo.s3.ap-northeast-2.amazonaws.com/flowbit_email_logo.svg" alt="Flowbit 로고" style="height: 48px; max-width: 100%; height: auto;">
    </div>

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#2352d5; border-radius:16px; box-sizing: border-box;">
        <tr>
            <td style="padding:32px 24px; color:white; font-family:Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                <h2 style="margin:0 0 8px; font-size:18px; font-weight: 500;">FLOWBIT 알림 서비스</h2>
                <p style="margin:0; font-size:14px;">관심사 기반 AI 뉴스 추천</p>
            </td>
            <td style="vertical-align:bottom; text-align: -webkit-right;">
                <img src="https://likelionvideo.s3.ap-northeast-2.amazonaws.com/banner_letter.svg" alt="레터 아이콘" width="88" style="display:block; max-width: 100%; height: auto;">
            </td>
        </tr>
    </table>

<th:block th:text="${keywordsPlaceHolder}"></th:block>

    <div style="background: #ffffff; border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #e5e7eb; box-sizing: border-box; width: 100%;">

        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#2352d5; border-radius:16px; font-family:Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; box-sizing: border-box;">
            <tr>
                <td style="padding: 24px; color: white;">
                    <h2 style="margin: 0 0 6px; font-size: 18px; font-weight: 500;">암호화폐 예측 가격</h2>
                    <p style="margin: 0; font-size: 14px; line-height: 1.5;">바쁜 당신을 위한<br>AI가 분석한 가상화폐 예측 가격</p>
                </td>
                <td style="padding: 24px; vertical-align: bottom; text-align: right;">
                    <!--                    <img src="https://likelionvideo.s3.ap-northeast-2.amazonaws.com/banner_letter.svg" alt="레터 아이콘" width="88" style="display: block;">-->
                </td>
            </tr>
        </table>

        <div style="margin-top: 16px; margin-bottom: 8px;">
            <span style="display: inline-block; font-size: 13px; color: #d1d5db;">2025.02.10</span>
        </div>

        <div style="margin-top: 12px; background-color: #f7f9fb; border-radius: 12px; overflow: hidden;">
            <div th:each="crypto : ${cryptoData.cryptos}" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 16px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img th:src="${crypto.imageUrl}" alt="코인" style="width: 32px; height: 32px; max-width: 100%; height: auto;">
                    <div style="font-size: 15px; font-weight: 500;">
                        <span th:text="${crypto.name + '/KRW'}"></span><br>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 13px;" th:style="'color:' + (${crypto.changeRate.startsWith('+')} ? '#f33' : '#0099ff')">
                        <span th:text="${crypto.changeRate}"></span>
                        <img th:src="${crypto.changeRateIconUrl}" style="width: 14px; height: 14px; vertical-align: middle; max-width: 100%; height: auto;">
                    </div>
                    <div style="font-size: 20px; font-weight: 500; color: #1d1d1f;" th:text="${crypto.actualPrice}">0</div>
                </div>
            </div>
        </div>

        <a href="https://flowbit.co.kr" style="margin-top: 20px; display: block; text-align: center; background-color: #ffffff; color: #555555; padding: 14px 0; border-radius: 12px; text-decoration: none; font-weight: 500; border: 0.5px solid #555555 ">AI 차트해석 보기 &gt;</a>
    </div>

<th:block th:text="${newsDataPlaceHolder}"></th:block>

    <div style="margin-top: 40px; text-align: center; font-size: 13px; color: #777; border-top: 1px solid #e5e7eb; padding-top: 24px;">
        <div style="margin-bottom: 12px;">
            <img src="https://img.icons8.com/ios-glyphs/30/share-rounded.png" width="20" style="margin: 0 8px; max-width: 100%; height: auto;">
            <img src="https://img.icons8.com/ios-filled/30/instagram-new.png" width="20" style="margin: 0 8px; max-width: 100%; height: auto;">
            <img src="https://img.icons8.com/ios-filled/30/home.png" width="20" style="margin: 0 8px; max-width: 100%; height: auto;">
        </div>
        <div style="margin-bottom: 16px;">flowbit &nbsp;|&nbsp; flowbit.korea@gmail.com</div>
        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <a href="#" style="background: #ffffff; padding: 10px 16px; border-radius: 12px; text-decoration: none; color: #333; font-weight: 500; font-size: 14px;">수신거부 &gt;</a>
            <a href="https://flowbit.co.kr" style="background: #ffffff; padding: 10px 16px; border-radius: 12px; text-decoration: none; color: #333; font-weight: 500; font-size: 14px;">웹에서 보기 &gt;</a>
            <a href="#" style="background: #ffffff; padding: 10px 16px; border-radius: 12px; text-decoration: none; color: #333; font-weight: 500; font-size: 14px;">구독취소 &gt;</a>
        </div>
    </div>
</div>
</body>
</html>

<div th:each="news : ${newsData}" style="margin-top: 24px; background: #ffffff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 20px; box-sizing: border-box;">
    <div style="font-size: 13px; color: #999; margin-bottom: 8px;">Weekly Coin</div>
    <div style="font-size: 17px; font-weight: 500; margin-bottom: 16px;" th:text="${news.title}">뉴스 제목</div>
    <div style="overflow: hidden; border-radius: 12px; margin-bottom: 16px; height: 180px;">
        <img th:if="${news.img}" th:src="${news.img}" alt="뉴스 이미지" style="width: 100%; height: 100%; object-fit: cover; max-width: 100%; height: auto;">
        <img th:if="${news.img == null || news.img == ''}" src="https://likelionvideo.s3.ap-northeast-2.amazonaws.com/flowbit.png" alt="기본 이미지" style="width: 100%; height: 100%; object-fit: cover; max-width: 100%; height: auto;">
    </div>
    <div style="margin: 16px 0 8px; font-weight: 500; font-size: 15px;">AI 본문 요약</div>
    <div style="font-size: 14px; color: #333; line-height: 1.5;" th:text="${news.description}">뉴스 설명</div>
    <div style="margin-top: 16px;">
        <div style="font-size: 13px; font-weight: 500; margin-bottom: 6px;">내 관심 키워드</div>
        <div>
            <span th:text="${'#' + news.pubDate}" style="background: #ffffff; padding: 6px 12px; border-radius: 4px; font-size: 14px; margin-right: 6px; border: 1px solid #F0F0F0;">#태그</span>
        </div>
    </div>
    <a th:href="${news.link}" style="margin-top: 20px; display: inline-block; text-align: center; background-color: #2352d5; color: white; padding: 12px 16px; border-radius: 12px; text-decoration: none; font-weight: 500;">기사 원문 보기 &gt;</a>
</div>

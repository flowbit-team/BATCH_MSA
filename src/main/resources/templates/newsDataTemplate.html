                <tr>
                    <td style="padding: 20px;">
                        <h2 style="font-size: 18px; margin-bottom: 16px; text-align: left;">최신 뉴스</h2>
                        <div th:each="news : ${newsData}" style="margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid #e5e7eb;">
                            <img th:src="${news.img}" alt="News Image" style="width: 100%; height: auto; border-radius: 12px; margin-bottom: 12px;">
                            <h4 style="font-size: 20px; margin: 0 0 8px;" th:text="${news.title}"></h4>
                            <p style="font-size: 14px; color: #555; margin: 0 0 8px;" th:text="${news.description}"></p>
                            <p style="font-size: 12px; color: #999; margin: 0 0 16px;" th:text="${news.pubDate}"></p>
                            <a th:href="${news.link}" target="_blank" style="font-size: 14px; text-decoration: none; color: #007bff;">Read More</a>
                        </div>
                    </td>
                </tr>
